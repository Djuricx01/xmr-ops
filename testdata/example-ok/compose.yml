services:
  wallet-rpc:
    image: monero-wallet-rpc:v0.18.3.4
    command:
      - --rpc-bind-ip=127.0.0.1
      - --rpc-login-file=/run/secrets/wallet-rpc-login
    ports:
      - "127.0.0.1:18082:18082"

  monerod:
    image: ghcr.io/sethforprivacy/simple-monerod:v0.18.3.4
    command:
      - --restricted-rpc
      - --rpc-bind-ip=127.0.0.1
    ports:
      - "127.0.0.1:18081:18081"
